<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بۆ تاقانەکەم Nahi | Nariman</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100;300;400;700&family=Alex+Brush&display=swap" rel="stylesheet" />

    <style>
        :root {
            --amber: #ff9500;
            --neon-amber: #ffaa00;
            --dark: #030303;
            --highlight: #22c55e;
        }

        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Noto Sans Arabic', sans-serif;
            overflow: hidden;
            margin: 0;
            user-select: none;
            height: 100vh;
        }

        /* Neon & Spotlight */
        .spotlight {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle 400px at var(--x, 50%) var(--y, 50%), rgba(255,149,0,0.08), transparent 80%);
            pointer-events: none;
        }

        /* Falling Petals */
        .petal-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        .petal {
            position: absolute;
            background: var(--amber);
            border-radius: 150% 0 150% 0;
            opacity: 0.3;
            filter: blur(1px);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Brush & Neon Animation for Name */
        .brush-text {
            fill: none;
            stroke: var(--amber);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            filter: drop-shadow(0 0 5px var(--amber)) drop-shadow(0 0 15px var(--amber));
        }

        .draw-brush {
            animation: drawName 6s forwards ease-in-out, neonFlicker 3s infinite 5s;
        }

        @keyframes drawName {
            to { stroke-dashoffset: 0; fill: rgba(255, 149, 0, 0.1); }
        }

        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                filter: drop-shadow(0 0 5px var(--amber)) drop-shadow(0 0 20px var(--amber));
                opacity: 1;
            }
            20%, 22%, 24%, 55% {
                filter: none;
                opacity: 0.7;
            }
        }

        /* Word Neon Logic */
        .word-current { 
            color: var(--highlight); 
            text-shadow: 0 0 10px var(--highlight), 0 0 20px var(--highlight); 
        }
        .word-done { 
            color: #ffffff; 
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
            transition: all 0.8s ease; 
        }

        /* 3D Glass Card */
        #final-card {
            transform-style: preserve-3d;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 149, 0, 0.15);
            border-radius: 45px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            perspective: 1000px;
        }

        .hidden-scene { opacity: 0; visibility: hidden; transform: translateY(30px); transition: 2s; }
        .active-scene { opacity: 1; visibility: visible; transform: translateY(0); }

        .orb-wrapper {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            width: 30px; height: 30px;
        }

        .orb-neon {
            position: absolute;
            inset: -10px;
            background: var(--amber);
            border-radius: 50%;
            filter: blur(15px);
            animation: orbPulse 2s infinite;
        }

        @keyframes orbPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.4); }
        }

        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--amber); }
    </style>
</head>
<body>

    <div class="spotlight" id="spotlight"></div>
    <div class="petal-container" id="petals"></div>
    <div id="particles-container"></div>

    <!-- 1. INTRO -->
    <div id="intro" class="fixed inset-0 flex flex-col items-center justify-center z-[500] text-center px-6">
        <h1 id="intro-l1" class="text-3xl md:text-5xl font-extralight mb-8 tracking-tight"></h1>
        <h2 id="intro-l2" class="text-lg md:text-xl mb-12 opacity-40 italic font-light"></h2>
        <button id="start-btn" class="opacity-0 px-16 py-5 border border-amber-500/20 rounded-full text-amber-500 uppercase tracking-[8px] text-[11px] transition-all duration-1000 hover:bg-amber-500/10 active:scale-95">
            دەستپێکردنی گەشتەکە
        </button>
    </div>

    <!-- 2. MEMORY SCENE -->
    <div id="memory-scene" class="fixed inset-0 hidden-scene flex items-center justify-center">
        <div id="orb-layer" class="absolute inset-0"></div>
        <p id="memory-txt" class="text-2xl md:text-4xl px-12 text-center font-light leading-relaxed max-w-4xl"></p>
    </div>

    <!-- 3. FINAL SCENE -->
    <div id="final-scene" class="fixed inset-0 hidden-scene flex flex-col items-center justify-center z-[1000] px-6">
        
        <div class="relative w-full max-w-[600px] h-[250px] flex items-center justify-center mb-10">
            <!-- Brush Neon Name SVG -->
            <svg viewBox="0 0 500 200" class="w-full h-full">
                <text x="50%" y="60%" text-anchor="middle" font-family="'Alex Brush', cursive" font-size="130" id="brush-name" class="brush-text">
                    Nahi
                </text>
            </svg>
        </div>

        <div id="final-card" class="p-10 md:p-16 w-full max-w-2xl text-center opacity-0 translate-y-10 transition-all duration-[2.5s]">
            <h3 id="final-head" class="text-2xl md:text-3xl font-bold text-amber-500 mb-8 drop-shadow-[0_0_10px_rgba(255,149,0,0.5)]"></h3>
            <div id="final-body" class="max-h-[220px] overflow-y-auto custom-scroll pr-4 text-base md:text-lg leading-[2.5] font-light text-justify text-orange-50/90"></div>
        </div>
    </div>

    <script>
        const memories = [
            "تا ئێستاش، کە سەیری چاوانت دەکەم، جیهان بێدەنگ دەبێت.",
            "چاوانت هێشتا تاکە نیشتمانی ئارامیی دڵمن.",
            "ئەو هەستەی بۆ تۆم هەیە، قەت کۆن نابێت... تەنها قووڵتر دەبێت.",
            "هەر جارێک ناوت دەبیستم، دڵم وەک یەکەم بینین دەلەرزێتەوە.",
            "وتم خۆشم دەوێیت... بەڵام هەندێک هەست، هەموو ڕۆژێک نوێ دەبنەوە."
        ];

        const finalPoem = "ڕەنگە پێشتریش پێم وتبیت... بەڵام هەندێک قسە هەن، جارێکی تریان، لە ناخی دڵەوە جوانتر دەوترێن. تا ئێستاش... کە سەیری چاوانت دەکەم، هەمان ئەو هێمنی و لەرزینە دێتەوە ڕێم. هیچ شتێک لە مندا نەگۆڕاوە، بەڵکو هەموو شتێک بۆ تۆ زیاتر بووە. کاتێک ناوت دەهێنم، هەست دەکەم هەموو جوانییەکانی دونیا لە یەک وشەدا کۆبوونەتەوە.";

        let step = 0;

        // Mouse Move Effects
        window.addEventListener('mousemove', (e) => {
            document.getElementById('spotlight').style.setProperty('--x', `${(e.clientX/window.innerWidth)*100}%`);
            document.getElementById('spotlight').style.setProperty('--y', `${(e.clientY/window.innerHeight)*100}%`);
            
            const card = document.getElementById('final-card');
            if(card.style.opacity == "1") {
                const rotX = (window.innerHeight/2 - e.clientY) / 25;
                const rotY = (e.clientX - window.innerWidth/2) / 25;
                card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            }
        });

        // Petal Rain
        function createPetals() {
            const container = document.getElementById('petals');
            for(let i=0; i<30; i++) {
                const p = document.createElement('div');
                p.className = 'petal';
                p.style.width = Math.random()*12 + 6 + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random()*100 + 'vw';
                p.style.animationDuration = Math.random()*5 + 5 + 's';
                p.style.animationDelay = Math.random()*5 + 's';
                container.appendChild(p);
            }
        }

        async function init() {
            createPetals();
            createParticles();
            await wait(1000);
            await typeByWord("intro-l1", "هەندێک هەست هەن... هەرگیز کۆن نابن...", 80);
            await typeByWord("intro-l2", "چونکە ڕەگەکانیان لەناو دڵدایە.", 60);
            document.getElementById("start-btn").style.opacity = "1";
        }

        document.getElementById("start-btn").onclick = () => {
            document.getElementById("intro").classList.add('hidden-scene');
            setTimeout(() => {
                document.getElementById("intro").remove();
                document.getElementById("memory-scene").classList.add("active-scene");
                spawnOrb();
            }, 1200);
        };

        function spawnOrb() {
            const layer = document.getElementById("orb-layer");
            const wrapper = document.createElement("div");
            wrapper.className = "orb-wrapper";
            wrapper.innerHTML = `<div class="orb-neon"></div><div class="relative w-full h-full bg-amber-500 rounded-full shadow-[0_0_20px_#ff9500]"></div>`;
            
            updatePos(wrapper);
            wrapper.onclick = async () => {
                if (step < memories.length) {
                    document.getElementById("memory-txt").innerHTML = "";
                    await typeByWord("memory-txt", memories[step], 60);
                    step++;
                    if(step < memories.length) updatePos(wrapper);
                    else { wrapper.remove(); finalize(); }
                }
            };
            layer.appendChild(wrapper);
        }

        function updatePos(el) {
            el.style.left = `${Math.random() * 70 + 15}%`;
            el.style.top = `${Math.random() * 70 + 15}%`;
        }

        async function finalize() {
            document.getElementById("memory-scene").classList.remove("active-scene");
            await wait(1500);
            document.getElementById("final-scene").classList.add("active-scene");
            
            await wait(1000);
            document.getElementById("brush-name").classList.add("draw-brush");
            
            await wait(5000);
            const card = document.getElementById("final-card");
            card.style.opacity = "1";
            card.style.transform = "translateY(0)";

            await typeByWord("final-head", "خۆشم دەوێی تاقانەکەم 🧡", 80);
            await typeByWord("final-body", finalPoem, 50);
        }

        async function typeByWord(id, text, speed) {
            const el = document.getElementById(id);
            const words = text.split(" ");
            el.innerHTML = "";
            for (let i = 0; i < words.length; i++) {
                const span = document.createElement("span");
                span.className = "word-current";
                el.appendChild(span);
                for (let char of words[i]) {
                    span.innerHTML += char;
                    await wait(speed);
                }
                span.className = "word-done";
                if (i < words.length - 1) el.appendChild(document.createTextNode(" "));
            }
        }

        function createParticles() {
            const container = document.getElementById("particles-container");
            for (let i = 0; i < 50; i++) {
                const d = document.createElement("div");
                d.className = "absolute bg-white rounded-full opacity-10";
                const size = Math.random() * 2 + 1;
                d.style.width = size + "px"; d.style.height = size + "px";
                d.style.left = Math.random() * 100 + "%"; d.style.top = Math.random() * 100 + "%";
                container.appendChild(d);
            }
        }

        const wait = (ms) => new Promise(res => setTimeout(res, ms));
        window.onload = init;
    </script>
</body>
</html>
