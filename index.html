<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بۆ تاقانەکەم | Nariman & Nahi</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100;300;400;700&family=Alex+Brush&display=swap" rel="stylesheet" />

    <style>
        :root {
            --amber: #ff9500;
            --dark: #030303;
            --highlight: #22c55e;
        }

        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Noto Sans Arabic', sans-serif;
            overflow: hidden;
            margin: 0;
            user-select: none;
            height: 100vh;
        }

        /* Atmosphere & Spotlight */
        .spotlight {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle 450px at var(--x, 50%) var(--y, 50%), rgba(255,149,0,0.08), transparent 80%);
            pointer-events: none;
        }

        /* Falling Petals with Wind Sway */
        .petal-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .petal {
            position: absolute;
            background: var(--amber);
            border-radius: 150% 0 150% 0;
            opacity: 0;
            filter: blur(0.5px);
            /* animation: fall-sway linear infinite; */
        }

        @keyframes fall-sway {
            0% { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            25% { transform: translate(var(--sway), 20vh) rotate(90deg); }
            50% { transform: translate(calc(var(--sway) * -1), 50vh) rotate(180deg); }
            75% { transform: translate(var(--sway), 80vh) rotate(270deg); }
            100% { transform: translate(0, 115vh) rotate(360deg); opacity: 0; }
        }

        /* Heart Burst Styling */
        .heart-burst {
            position: absolute;
            color: var(--amber);
            pointer-events: none;
            z-index: 90;
            text-shadow: 0 0 10px var(--amber);
            animation: heartAnim 2.5s forwards ease-out;
        }
        .heart-small { font-size: 16px; opacity: 0.9; }
        .heart-tiny { font-size: 8px; opacity: 0.6; filter: blur(1px); }

        @keyframes heartAnim {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot)); opacity: 0; }
        }

        /* Brush Neon Name */
        .brush-text {
            fill: none;
            stroke: var(--amber);
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1500;
            stroke-dashoffset: 1500;
            filter: drop-shadow(0 0 8px var(--amber)) drop-shadow(0 0 20px var(--amber));
        }

        .draw-brush {
            animation: drawName 7s forwards ease-in-out, neonFlicker 4s infinite 6s;
        }

        @keyframes drawName {
            70% { fill: rgba(255, 149, 0, 0); }
            100% { stroke-dashoffset: 0; fill: rgba(255, 149, 0, 0.15); }
        }

        @keyframes neonFlicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                filter: drop-shadow(0 0 10px var(--amber)) drop-shadow(0 0 30px var(--amber));
                opacity: 1;
            }
            20%, 24%, 55% { opacity: 0.8; }
        }

        /* Word Highlighting */
        .word-current { color: var(--highlight); text-shadow: 0 0 10px var(--highlight); }
        .word-done { color: #ffffff; text-shadow: 0 0 5px rgba(255,255,255,0.4); transition: all 0.8s ease; }

        /* Orb Styling */
        .orb-wrapper {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            width: 32px; height: 32px;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .orb-neon-core {
            position: absolute;
            inset: -8px;
            background: var(--amber);
            border-radius: 50%;
            filter: blur(15px);
            animation: orbPulse 2s infinite;
        }

        @keyframes orbPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.4); }
        }

        #final-card {
            transform-style: preserve-3d;
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 149, 0, 0.2);
            border-radius: 45px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        .hidden-scene { opacity: 0; visibility: hidden; transform: translateY(30px); transition: 2s; }
        .active-scene { opacity: 1; visibility: visible; transform: translateY(0); }

        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--amber); }
    </style>
</head>
<body>

    <div class="spotlight" id="spotlight"></div>
    <div id="petals" class="petal-container"></div>
    <div id="particles-container" class="fixed inset-0 z-[-1]"></div>

    <!-- 1. INTRO -->
    <div id="intro" class="fixed inset-0 flex flex-col items-center justify-center z-[500] text-center px-6">
        <h1 id="intro-l1" class="text-3xl md:text-5xl font-extralight mb-8 tracking-tight"></h1>
        <h2 id="intro-l2" class="text-lg md:text-xl mb-12 opacity-40 italic font-light"></h2>
        <button id="start-btn" class="opacity-0 px-16 py-5 border border-amber-500/30 rounded-full text-amber-500 uppercase tracking-[8px] text-[11px] transition-all duration-1000 hover:bg-amber-500/10 active:scale-95">
            دەستپێکردنی گەشتەکە
        </button>
    </div>

    <!-- 2. MEMORY SCENE -->
    <div id="memory-scene" class="fixed inset-0 hidden-scene flex items-center justify-center">
        <div id="orb-layer" class="absolute inset-0"></div>
        <p id="memory-txt" class="text-2xl md:text-4xl px-12 text-center font-light leading-relaxed max-w-4xl"></p>
    </div>

    <!-- 3. FINAL SCENE -->
    <div id="final-scene" class="fixed inset-0 hidden-scene flex flex-col items-center justify-center z-[1000] px-6">
        <div class="relative w-full max-w-[900px] h-[250px] flex items-center justify-center mb-6">
            <svg viewBox="0 0 1000 250" class="w-full h-full">
                <text x="50%" y="60%" text-anchor="middle" font-family="'Alex Brush', cursive" font-size="110" id="brush-name" class="brush-text">
                    Nariman & Nahi
                </text>
            </svg>
        </div>
        <div id="final-card" class="p-10 md:p-14 w-full max-w-2xl text-center opacity-0 translate-y-10 transition-all duration-[2.5s]">
            <h3 id="final-head" class="text-2xl md:text-3xl font-bold text-amber-500 mb-8"></h3>
            <div id="final-body" class="max-h-[220px] overflow-y-auto custom-scroll pr-4 text-base md:text-lg leading-[2.6] font-light text-justify text-orange-50/90"></div>
        </div>
    </div>

    <script>
        const memories = [
            "تا ئێستاش، کە سەیری چاوانت دەکەم، جیهان بێدەنگ دەبێت.",
            "چاوانت هێشتا تاکە نیشتمانی ئارامیی دڵمن.",
            "ئەو هەستەی بۆ تۆم هەیە، قەت کۆن نابێت... تەنها قووڵتر دەبێت.",
            "هەر جارێک ناوت دەبیستم، دڵم وەک یەکەم بینین دەلەرزێتەوە.",
            "وتم خۆشم دەوێیت... بەڵام هەندێک هەست، هەموو ڕۆژێک نوێ دەبنەوە."
        ];

        const finalPoem = "ڕەنگە پێشتریش پێم وتبیت... بەڵام هەندێک قسە هەن، جارێکی تریان، لە ناخی دڵەوە جوانتر دەوترێن. تا ئێستاش... کە سەیری چاوانت دەکەم، هەمان ئەو هێمنی و لەرزینە دێتەوە ڕێم. هیچ شتێک لە مندا نەگۆڕاوە، بەڵکو هەموو شتێک بۆ تۆ زیاتر بووە. کاتێک ناوت دەهێنم، هەست دەکەم هەموو جوانییەکانی دونیا لە یەک وشەدا کۆبوونەتەوە.";

        let step = 0;

        window.addEventListener('mousemove', (e) => {
            document.getElementById('spotlight').style.setProperty('--x', `${(e.clientX/window.innerWidth)*100}%`);
            document.getElementById('spotlight').style.setProperty('--y', `${(e.clientY/window.innerHeight)*100}%`);
            const card = document.getElementById('final-card');
            if(card.style.opacity == "1") {
                const rotX = (window.innerHeight/2 - e.clientY) / 30;
                const rotY = (e.clientX - window.innerWidth/2) / 30;
                card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            }
        });

        // FIXED: Petal Rain with Wind Effect
        function createPetals() {
            const container = document.getElementById('petals');
            container.innerHTML = ""; 
            for(let i=0; i<45; i++) {
                const p = document.createElement('div');
                p.className = 'petal';
                const size = Math.random()*12+8;
                p.style.width = size + 'px';
                p.style.height = (size * 0.7) + 'px';
                p.style.left = Math.random()*100+'vw';
                
                // Random Wind Sway Amount (e.g., 40px to 100px)
                const sway = Math.random() * 60 + 40 + 'px';
                p.style.setProperty('--sway', sway);
                
                p.style.animation = `fall-sway ${Math.random()*6+6}s linear infinite`;
                p.style.animationDelay = Math.random()*10 + 's';
                container.appendChild(p);
            }
        }

        function spawnHearts(x, y) {
            const layer = document.getElementById("orb-layer");
            const create = (type) => {
                const h = document.createElement("div");
                h.className = `heart-burst heart-${type}`;
                h.innerHTML = "❤";
                h.style.left = x;
                h.style.top = y;
                const tx = (Math.random() - 0.5) * 200 + "px";
                const ty = (Math.random() * -150 - 50) + "px";
                const rot = (Math.random() * 90 - 45) + "deg";
                h.style.setProperty('--tx', tx);
                h.style.setProperty('--ty', ty);
                h.style.setProperty('--rot', rot);
                layer.appendChild(h);
                setTimeout(() => h.remove(), 2500);
            };
            for(let i=0; i<5; i++) create('small');
            for(let i=0; i<3; i++) create('tiny');
        }

        async function init() {
            createPetals(); 
            createParticles();
            await wait(1000);
            await typeByWord("intro-l1", "هەندێک هەست هەن... هەرگیز کۆن نابن...", 80);
            await typeByWord("intro-l2", "چونکە ڕەگەکانیان لەناو دڵدایە.", 60);
            document.getElementById("start-btn").style.opacity = "1";
        }

        document.getElementById("start-btn").onclick = () => {
            document.getElementById("intro").classList.add('hidden-scene');
            setTimeout(() => {
                document.getElementById("intro").remove();
                document.getElementById("memory-scene").classList.add("active-scene");
                spawnOrb();
            }, 1200);
        };

        function spawnOrb() {
            const layer = document.getElementById("orb-layer");
            const wrapper = document.createElement("div");
            wrapper.className = "orb-wrapper";
            wrapper.innerHTML = `<div class="orb-neon-core"></div><div class="relative w-full h-full bg-amber-500 rounded-full shadow-[0_0_20px_#ff9500]"></div>`;
            updatePos(wrapper);
            wrapper.onclick = async () => {
                if (step < memories.length) {
                    spawnHearts(wrapper.style.left, wrapper.style.top);
                    document.getElementById("memory-txt").innerHTML = "";
                    await typeByWord("memory-txt", memories[step], 60);
                    step++;
                    if(step < memories.length) updatePos(wrapper);
                    else { wrapper.remove(); finalize(); }
                }
            };
            layer.appendChild(wrapper);
        }

        function updatePos(el) {
            el.style.left = `${Math.random() * 70 + 15}%`;
            el.style.top = `${Math.random() * 70 + 15}%`;
        }

        async function finalize() {
            document.getElementById("memory-scene").classList.remove("active-scene");
            await wait(1500);
            document.getElementById("final-scene").classList.add("active-scene");
            await wait(1000);
            document.getElementById("brush-name").classList.add("draw-brush");
            await wait(6000);
            const card = document.getElementById("final-card");
            card.style.opacity = "1";
            card.style.transform = "translateY(0)";
            await typeByWord("final-head", "خۆشم دەوێی ژوشکەکەم 🧡", 80);
            await typeByWord("final-body", finalPoem, 50);
        }

        async function typeByWord(id, text, speed) {
            const el = document.getElementById(id);
            const words = text.split(" ");
            el.innerHTML = "";
            for (let i = 0; i < words.length; i++) {
                const span = document.createElement("span");
                span.className = "word-current";
                el.appendChild(span);
                for (let char of words[i]) {
                    span.innerHTML += char;
                    await wait(speed);
                }
                span.className = "word-done";
                if (i < words.length - 1) el.appendChild(document.createTextNode(" "));
            }
        }

        function createParticles() {
            const container = document.getElementById("particles-container");
            for (let i = 0; i < 60; i++) {
                const d = document.createElement("div");
                d.className = "absolute bg-white rounded-full opacity-10";
                const size = Math.random()*2+1;
                d.style.width = size+"px"; d.style.height = size+"px";
                d.style.left = Math.random()*100+"%"; d.style.top = Math.random()*100+"%";
                container.appendChild(d);
            }
        }

        const wait = (ms) => new Promise(res => setTimeout(res, ms));
        window.onload = init;
    </script>
</body>
</html>
